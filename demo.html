<!DOCTYPE >
<html>
    <head>
        <title>dumogu-dropdown-menu demo</title>
        <meta
            name="viewport"
            content="width=device-width, user-scalable=no, initial-scale=1, maximum-scale=1"
        />
        <link rel="stylesheet" href="./dist/dumogu-dropdown-menu.css" />
        <script src="./dist/dumogu-dropdown-menu.umd.js"></script>
        <style>
            body {
                font-size: 12px;
                margin: 0;
                padding: 0;
            }
            .dumogu-dropdown-menu-demo > .container {
                height: 150vh;
                width: 150vw;
            }
            .dumogu-dropdown-menu-demo > .container > .bt {
                position: absolute;
                left: 50vw;
                top: 50vh;
                width: max-content;
                cursor: pointer;
            }
            .dumogu-dropdown-menu-demo > .container > .bt-group {
                position: absolute;
                left: 50vw;
                top: calc(50vh + 40px);
                display: flex;
                gap: 10px;
            }
            .dumogu-dropdown-menu-demo > .container > .bt-group > button {
                cursor: pointer;
            }
            /** 挂载到自定义容器的示例，容器需要是非 static 定位 */
            .dumogu-dropdown-menu-demo > .box {
                position: relative;
                margin: 30px;
                height: 300px;
                width: 400px;
                border: 1px solid #ccc;
                overflow: auto;
            }
            .dumogu-dropdown-menu-demo > .box > .bt {
                position: absolute;
                left: 150px;
                top: 100px;
                width: max-content;
                cursor: pointer;
            }
            /** demo 自定义的菜单样式,库本身不提供主题 */
            .demo-theme {
                min-width: 150px;
                display: flex;
                flex-direction: column;
                width: max-content;
                box-sizing: border-box;
                background-color: #1f1f23;
                box-shadow:
                    0 4px 8px rgba(0, 0, 0, 0.4),
                    0 0px 4px rgba(0, 0, 0, 0.4);
                border: 1px solid #ffffff1d;
                border-radius: 8px;
            }
            .demo-theme_item {
                min-width: 150px;
                display: flex;
                align-items: center;
                padding: 15px 25px;
                box-sizing: border-box;
                font-size: 13px;
                font-weight: bold;
                cursor: pointer;
                transition: all 0.2s;
                color: rgb(206, 206, 206);
                border-bottom: 1px solid #ffffff1d;
                line-height: 1;
            }
            .demo-theme_item:hover {
                background-color: rgba(145, 145, 162, 0.17);
                color: #007fff;
            }
            .demo-theme_item:last-child {
                border-bottom: none;
            }
        </style>
        <script>
            window.addEventListener('DOMContentLoaded', function () {
                const { DumoguDropdownMenu } = window['dumogu-dropdown-menu'];
                const ddInstanceList = [];
                const btEl = document.getElementById('bt');
                function getArea(el) {
                    const elRect = el.getBoundingClientRect();
                    const area = {
                        start: [elRect.x, elRect.y],
                        end: [elRect.x + elRect.width, elRect.y + elRect.height],
                        width: elRect.width,
                        height: elRect.height,
                    };
                    return area;
                }
                const ddInstance = new DumoguDropdownMenu({
                    // 可以是html文本，样式完全由使用方自定义
                    content: `
                        <div class="demo-theme">
                            <div class="demo-theme_item"> 测试 </div>
                            <div class="demo-theme_item"> 测试 </div>
                            <div class="demo-theme_item"> 测试 </div>
                        </div>
                    `,
                    area: getArea(btEl),
                    show: true,
                });
                btEl.addEventListener('click', () => {
                    if (!ddInstance.show) {
                        // 可以是element对象
                        const item_1 = document.createElement('div');
                        item_1.classList.add('demo-theme');
                        const item_1_child = document.createElement('div');
                        item_1_child.innerHTML = '测试';
                        item_1_child.classList.add('demo-theme_item');
                        item_1_child.onclick = () => {
                            ddInstance.show = false;
                            ddInstance.apply();
                            console.log('所绑定的数据：', { test: 1 });
                        };
                        item_1.appendChild(item_1_child);
                        ddInstance.content = item_1;
                    }
                    ddInstance.area = getArea(btEl); // 设置需要显示的区域
                    ddInstance.show = !ddInstance.show; // 显示/隐藏菜单
                    ddInstance.apply(); // 属性写入后同步到 DOM
                });
                ddInstanceList.push([ddInstance, btEl]);
                /** 初始化隐藏事件，点击页面的其他地方可以隐藏菜单 */
                function initHiddenEvent(ddInstance_, btEl_) {
                    function callbackFn(e) {
                        if (!e || !e.target) return;
                        if (!ddInstance_.show) return;
                        if (ddInstance_.isDestroyed) return;
                        if (
                            !ddInstance_.dropdownMenuContainerEl.contains(e.target) &&
                            !btEl_.contains(e.target)
                        ) {
                            ddInstance_.show = false;
                            ddInstance_.apply();
                        }
                    }
                    document.addEventListener('click', callbackFn);
                }
                /** 创建实例并绑定显示/隐藏、隐藏事件和位置更新 */
                function createMenu(btEl_, options) {
                    const ddInstance_ = new DumoguDropdownMenu({
                        area: getArea(btEl_),
                        show: true,
                        ...options,
                    });
                    btEl_.addEventListener('click', () => {
                        ddInstance_.area = getArea(btEl_);
                        ddInstance_.show = !ddInstance_.show;
                        ddInstance_.apply();
                    });
                    ddInstanceList.push([ddInstance_, btEl_]);
                    initHiddenEvent(ddInstance_, btEl_);
                    return ddInstance_;
                }
                initHiddenEvent(ddInstance, btEl);
                /** 挂载到自定义容器的示例，不传 container 时挂载到 body 上 */
                createMenu(document.getElementById('box-bt'), {
                    container: document.getElementById('box'),
                    content: `
                        <div class="demo-theme">
                            <div class="demo-theme_item"> 容器内测试 </div>
                            <div class="demo-theme_item"> 容器内测试 </div>
                        </div>
                    `,
                });
                /** offset 示例：与触发区域边缘保持 12px 距离 */
                createMenu(document.getElementById('bt-offset'), {
                    offset: 12,
                    content: `
                        <div class="demo-theme">
                            <div class="demo-theme_item"> 间距 12px </div>
                        </div>
                    `,
                });
                /** displayAreaLimit 示例：'vertical' 强制以纵向为主 */
                createMenu(document.getElementById('bt-vertical'), {
                    displayAreaLimit: 'vertical',
                    content: `
                        <div class="demo-theme">
                            <div class="demo-theme_item"> 垂直显示 </div>
                            <div class="demo-theme_item"> 垂直显示 </div>
                        </div>
                    `,
                });
                /** displayAreaLimit 示例：'horizontal' 强制以横向为主 */
                createMenu(document.getElementById('bt-horizontal'), {
                    displayAreaLimit: 'horizontal',
                    content: `
                        <div class="demo-theme">
                            <div class="demo-theme_item"> 水平显示 </div>
                            <div class="demo-theme_item"> 水平显示 </div>
                        </div>
                    `,
                });
                window.ddInstance = ddInstance;
                /**
                 * 每一帧更新位置
                 * 因为有很多原因导致元素的位置发生移动，无法在每一个场景去设置位置
                 */
                function updateDdInstance() {
                    requestAnimationFrame(() => {
                        ddInstanceList.forEach(([item, itemBtEl]) => {
                            item.area = getArea(itemBtEl);
                            item.apply();
                        });
                        updateDdInstance();
                    });
                }
                updateDdInstance();
            });
        </script>
    </head>

    <body>
        <div class="dumogu-dropdown-menu-demo">
            <a
                href="https://github.com/wurencaideli/dumogu-dropdown-menu"
                target="_blank"
                rel="noopener noreferrer"
                >Github</a
            >
            <a href="https://blog.dumogu.top" target="_blank" rel="noopener noreferrer">博客</a>
            <div class="container">
                <div>完全由用户定义显示位置，显示时机，请滚动页面找到按钮点击查看。</div>
                <button id="bt" class="bt">测试</button>
                <div class="bt-group">
                    <button id="bt-offset">间距测试</button>
                    <button id="bt-vertical">垂直显示</button>
                    <button id="bt-horizontal">水平显示</button>
                </div>
            </div>
            <div id="box" class="box">
                <button id="box-bt" class="bt">容器内测试</button>
            </div>
        </div>
    </body>
</html>
